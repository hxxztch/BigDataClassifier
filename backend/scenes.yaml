categories:
- 电商零售
- 交通物流
- 工业制造
- 金融风控
- 医疗健康
- '123'
scenes:
  shop_shipping:
    name: 商品配送时效预测
    category: 电商零售
    description: 预测商品是否准时送达
    target_col: Reached_on_Time_Y_N
    label_map:
      0: On Time
      1: Delayed
    required_cols:
    - Warehouse_block
    - Mode_of_Shipment
    - Customer_care_calls
    - Customer_rating
    - Cost_of_the_Product
    - Prior_purchases
    - Product_importance
    - Gender
    - Discount_offered
    - Weight_in_gms
    - Reached_on_Time_Y_N
    preprocessing: shop_shipping
  shop_churn:
    name: 用户流失预警
    category: 电商零售
    description: 预测用户是否将流失
    target_col: Churn
    label_map:
      0: Retain
      1: Churn
    required_cols:
    - Churn
    - Tenure
    - PreferredLoginDevice
    - CityTier
    - WarehouseToHome
    - PreferredPaymentMode
    - Gender
    - HourSpendOnApp
    - NumberOfDeviceRegistered
    - PreferedOrderCat
    - SatisfactionScore
    - MaritalStatus
    - NumberOfAddress
    - Complain
    - OrderAmountHikeFromlastYear
    - CouponUsed
    - OrderCount
    - DaySinceLastOrder
    - CashbackAmount
  shop_fraud:
    name: 交易欺诈检测
    category: 电商零售
    description: 检测交易是否为欺诈
    target_col: Class
    label_map:
      0: Normal
      1: Fraud
    required_cols:
    - V1
    - V2
    - V3
    - V4
    - V5
    - V6
    - V7
    - V8
    - V9
    - V10
    - V11
