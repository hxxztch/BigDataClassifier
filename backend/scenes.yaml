    - V21
    - V22
    - V23
    - V24
    - V25
    - V26
    - V27
    - V28
    - Amount
    - Class
    features_desc: V1 - V28, Amount
  shop_order:
    name: 用户下单预测
    category: 电商零售
    description: 预测用户是否会下单购买
    target_col: ordered
    label_map:
      0: Browse
      1: Order
    required_cols:
    - basket_icon_click
    - basket_add_list
    - basket_add_detail
    - sort_by
    - image_picker
    - account_page_click
    - promo_banner_click
    - detail_wishlist_add
    - list_size_dropdown
    - closed_minibasket_click
    - checked_delivery_detail
    - checked_returns_detail
    - sign_in
    - saw_checkout
    - saw_sizecharts
    - saw_delivery
    - saw_account_upgrade
    - saw_homepage
    - device_mobile
    - device_computer
    - device_tablet
    - returning_user
    - loc_uk
    - ordered
    features_desc: basket_icon_click, basket_add_list, …, loc_uk
  trans_satisfaction:
    name: 乘客满意度
    category: 交通物流
    description: 预测航空乘客满意度
    target_col: satisfaction
    label_map:
      0: Neutral/Dissatisfied
      1: Satisfied
    required_cols:
    - Gender
    - Customer_Type
    - Age
    - Type_of_Travel
    - Class
    - Flight_Distance
    - Inflight_wifi_service
    - Departure/Arrival_time_convenient
    - Ease_of_Online_booking
    - Gate_location
    - Food_and_drink
    - Online_boarding
    - Seat_comfort
    - Inflight_entertainment
    - On-board_service
    - Leg_room_service
    - Baggage_handling
    - Checkin_service
    - Inflight_service
    - Cleanliness
    - Departure_Delay_in_Minutes
    - Arrival_Delay_in_Minutes
    - satisfaction
    features_desc: Gender, Customer_Type, …, Arrival_Delay_in_Minutes
  trans_delay:
    name: 航班延误预测
    category: 交通物流
    description: 预测航班是否延误
    target_col: DEP_DEL15
    label_map:
      0: On Time
      1: Delayed
